<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Around the US</title>

    <meta name="author" content="Kaitlyn Blanton" />
    <meta
      name="description"
      content="Browse stunning landmark photos, save your favorites, & explore iconic destinations worldwide."
    />
    <meta
      name="keywords"
      content="travel, landmarks, photography, national parks, tourist attractions, world travel, explore destinations, travel inspiration"
    />

    <link rel="stylesheet" href="./pages/index.css" />
    <link rel="icon" href="./favicon.ico" />
  </head>

  <body>
    <div class="page">
      <div
        class="page__overlay page__overlay_closed-modal"
        id="modal-background-overlay"
      ></div>

      <header class="header">
        <img
          src="./images/logo_around-the-us.svg"
          alt="'Around the United States' Logo"
          class="header__image"
        />
        <div class="header__border"></div>
      </header>

      <main class="content">
        <section class="profile">
          <img
            src="./images/jacques-cousteau.jpg"
            alt="An elderly man smiling in front of the ocean wearing a red beanie"
            class="profile__image"
          />

          <div>
            <div class="profile__user-info">
              <h1 class="profile__name" id="profile-name">Jacques Cousteau</h1>
              <button
                class="profile__button button button_type_edit"
                id="profile-edit-button"
              >
                <img
                  src="./images/edit-icon.svg"
                  alt="Edit user information"
                  class="button__icon button__icon_type_edit"
                />
              </button>
            </div>
            <p class="profile__description" id="profile-description">
              Explorer
            </p>
          </div>

          <button class="profile__button button button_type_add">
            <img
              src="./images/add-icon.svg"
              alt="Add a new destination post"
              class="button__icon button__icon_type_add"
            />
          </button>
        </section>

        <section class="gallery">
          <ul class="gallery__cards" id="card-gallery">
            <template class="card-template" id="card-template">
              <li class="card" id="card">
                <img
                  alt="Destination image."
                  class="card__image"
                  id="card-image"
                />

                <div class="card__content">
                  <h2 class="card__title" id="card-title"></h2>
                  <button class="card__button button button_type_heart">
                    <img
                      src="./images/heart-icon.svg"
                      alt="Like this post"
                      class="button__icon button__icon_type_heart"
                    />
                  </button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">&copy; 2026 Around The U.S.</p>
      </footer>

      <dialog class="edit-modal edit-modal_closed" id="edit-profile-modal">
        <button class="edit-modal__button button button_type_close-modal">
          <img
            src="./images/add-icon.svg"
            alt="Close the edit profile window."
            class="button__icon button__icon_type_close-modal"
            id="close-modal-button"
          />
        </button>

        <form action="#" class="edit-form" id="edit-form">
          <h2 class="edit-form__title">Edit profile</h2>

          <fieldset class="edit-form__fieldset fieldset">
            <label for="user-name" class="edit-form__label"></label>
            <input
              type="text"
              id="user-name"
              value="Jacques Cousteau"
              placeholder="Name Surname"
              class="edit-form__input edit-form__input_type_name"
              required
            />

            <div class="fieldset__border"></div>
          </fieldset>

          <fieldset class="edit-form__fieldset fieldset">
            <label for="user-description" class="edit-form__label"></label>
            <input
              type="text"
              id="user-description"
              value="Explorer"
              placeholder="Tell us about yourself..."
              class="edit-form__input edit-form__input_type_description"
              required
            />

            <div class="fieldset__border"></div>
          </fieldset>

          <button
            class="edit-form__button button button_type_submit"
            id="save-button"
          >
            Save
          </button>
        </form>
      </dialog>
    </div>

    <script src="./scripts/index.js"></script>
  </body>
</html>
