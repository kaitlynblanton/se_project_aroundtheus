<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Around the US</title>

    <meta name="author" content="Kaitlyn Blanton" />
    <meta
      name="description"
      content="Browse stunning landmark photos, save your favorites, & explore iconic destinations worldwide."
    />
    <meta
      name="keywords"
      content="travel, landmarks, photography, national parks, tourist attractions, world travel, explore destinations, travel inspiration"
    />

    <link rel="stylesheet" href="./pages/index.css" />
    <!-- delete all the extra fonts from the file that aren't used -->
    <!-- <link rel="icon" href="./favicon.ico"> -->
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="./images/logo_around-the-us.svg"
          alt="'Around the United States' Logo"
          class="header__image"
        />
        <div class="header__border"></div>
      </header>

      <main class="content">
        <section class="profile">
          <img
            src="./images/jacques-cousteau.jpg"
            alt="An elderly man smiling in front of the ocean wearing a red beanie"
            class="profile__image"
          />

          <div>
            <div class="profile__user-info">
              <h1 class="profile__name">Jacques Cousteau</h1>
              <button class="profile__button button button_type_edit">
                <img
                  src="./images/edit-icon.svg"
                  alt="Edit user information"
                  class="button__icon button__icon_type_edit"
                />
              </button>
            </div>
            <p class="profile__description">Explorer</p>
          </div>

          <button class="profile__button button button_type_add">
            <img
              src="./images/add-icon.svg"
              alt="Add a new destination post"
              class="button__icon button__icon_type_add"
            />
          </button>
        </section>

        <section class="gallery">
          <ul class="gallery__cards">
            <li class="card">
              <img
                src="./images/yosemite.jpg"
                alt="A river flowing through a pine forest with a granite cliff."
                class="card__image"
              />
              <div class="card__content">
                <h2 class="card__title">Yosemite Valley</h2>
                <button class="card__button button button_type_heart">
                  <img
                    src="./images/heart-icon.svg"
                    alt="Like this post"
                    class="button__icon button__icon_type_heart"
                  />
                </button>
              </div>
            </li>

            <li class="card">
              <img
                src="./images/lake-louise.jpg"
                alt="Turquoise alpine lake surrounded by towering peaks and glaciers in Banff National Park."
                class="card__image"
              />
              <div class="card__content">
                <h2 class="card__title">Lake Louise</h2>
                <button class="card__button button button_type_heart">
                  <img
                    src="./images/heart-icon.svg"
                    alt="Like this post"
                    class="button__icon button__icon_type_heart"
                  />
                </button>
              </div>
            </li>

            <li class="card">
              <img
                src="./images/bald-mountains.jpg"
                alt="Sweeping mountain ridges beneath a sunrise across the horizon."
                class="card__image"
              />
              <div class="card__content">
                <h2 class="card__title">Bald Mountains</h2>
                <button class="card__button button button_type_heart">
                  <img
                    src="./images/heart-icon.svg"
                    alt="Like this post"
                    class="button__icon button__icon_type_heart"
                  />
                </button>
              </div>
            </li>

            <li class="card">
              <img
                src="./images/latemar.jpg"
                alt="Jagged Dolomite peaks beneath a star-filled sky."
                class="card__image"
              />
              <div class="card__content">
                <h2 class="card__title">Latemar</h2>
                <button class="card__button button button_type_heart">
                  <img
                    src="./images/heart-icon.svg"
                    alt="Like this post"
                    class="button__icon button__icon_type_heart"
                  />
                </button>
              </div>
            </li>

            <li class="card">
              <img
                src="./images/vanoise.jpg"
                alt="Alpine lake reflecting snow-capped mountains."
                class="card__image"
              />
              <div class="card__content">
                <h2 class="card__title">Vanoise National Park</h2>
                <button class="card__button button button_type_heart">
                  <img
                    src="./images/heart-icon.svg"
                    alt="Like this post"
                    class="button__icon button__icon_type_heart"
                  />
                </button>
              </div>
            </li>

            <li class="card">
              <img
                src="./images/lago.jpg"
                alt="Crystal-clear alpine lake with wooden boats and dramatic Dolomite peaks."
                class="card__image"
              />
              <div class="card__content">
                <h2 class="card__title">Lago di Braies</h2>
                <button class="card__button button button_type_heart">
                  <img
                    src="./images/heart-icon.svg"
                    alt="Like this post"
                    class="button__icon button__icon_type_heart"
                  />
                </button>
              </div>
            </li>
          </ul>
        </section>
      </main>
      <!-- <footer class="footer">&copy; 2026 Around The U.S.</footer>  -->
    </div>
  </body>
</html>
